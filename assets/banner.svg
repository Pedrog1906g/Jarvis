<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="NEXUS AI - Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02060d"/>
      <stop offset="55%" stop-color="#04111f"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0a7cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circ"><circle cx="240" cy="200" r="110"/></clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- linhas HUD de fundo -->
  <g stroke="#0bd3ff" stroke-width="1" opacity=".12">
    <path d="M0 300 H1200"/><path d="M0 320 H1200"/><path d="M0 340 H1200"/>
    <path d="M120 0 V400"/><path d="M1080 0 V400"/>
    <circle cx="600" cy="200" r="260" fill="none"/>
    <circle cx="600" cy="200" r="180" fill="none"/>
  </g>

  <!-- imagem de marca do criador (circular) -->
  <image href="brand.png" x="130" y="90" width="220" height="220" clip-path="url(#circ)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="240" cy="200" r="112" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

  <!-- títulos -->
  <text x="400" y="180" font-family="'Orbitron','Segoe UI',sans-serif" font-size="92" font-weight="900" letter-spacing="10" fill="url(#neon)" filter="url(#glow)">NEXUS AI</text>
  <text x="404" y="228" font-family="'Segoe UI',sans-serif" font-size="22" letter-spacing="4" fill="#9bf3ff">ASSISTENTE PESSOAL DE IA · ESTILO J.A.R.V.I.S / F.R.I.D.A.Y</text>
  <text x="404" y="272" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="1" fill="#cfe9ff">🌟 O primeiro de muitos projetos de IA da NEXUS AI e de Pedrog1906g</text>
  <text x="404" y="316" font-family="'Share Tech Mono',monospace" font-size="15" letter-spacing="2" fill="#5d86a3">REATOR ONLINE · LINK SEGURO · SÃO PAULO / BR · SEMPRE CONECTADO À WEB</text>
  <text x="404" y="352" font-family="'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill="#00e5ff">Designed &amp; Developed by Pedrog1906g</text>

  <circle cx="1130" cy="70" r="8" fill="#ff3a58" filter="url(#glow)"/>
  <text x="1130" y="100" font-family="'Share Tech Mono',monospace" font-size="12" fill="#ff3a58" text-anchor="middle">SYS</text>
</svg>
