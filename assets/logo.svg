<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="NEXUS AI - Cérebro cibernético em falha">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#062033"/>
      <stop offset="100%" stop-color="#01060c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8f6ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0a7cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="40" fill="url(#bg)"/>

  <!-- anel externo -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)">
    <circle cx="120" cy="120" r="100" stroke-width="2.5" opacity=".55"/>
    <circle cx="120" cy="120" r="88" stroke-width="1.5" stroke-dasharray="2 8" opacity=".7"/>
  </g>

  <!-- parafusos fixos no anel -->
  <g fill="#08283b" stroke="#00e5ff" stroke-width="1.4">
    <g transform="translate(220,120)"><circle r="6"/><line x1="-4" y1="0" x2="4" y2="0" stroke="#9bf3ff"/></g>
    <g transform="translate(190.7,190.7)"><circle r="6"/><line x1="-3" y1="-3" x2="3" y2="3" stroke="#9bf3ff"/></g>
    <g transform="translate(120,220)"><circle r="6"/><line x1="-4" y1="0" x2="4" y2="0" stroke="#9bf3ff"/></g>
    <g transform="translate(49.3,190.7)"><circle r="6"/><line x1="-3" y1="-3" x2="3" y2="3" stroke="#9bf3ff"/></g>
    <g transform="translate(20,120)"><circle r="6"/><line x1="-4" y1="0" x2="4" y2="0" stroke="#9bf3ff"/></g>
    <g transform="translate(49.3,49.3)"><circle r="6"/><line x1="-3" y1="-3" x2="3" y2="3" stroke="#9bf3ff"/></g>
    <g transform="translate(120,20)"><circle r="6"/><line x1="-4" y1="0" x2="4" y2="0" stroke="#9bf3ff"/></g>
    <g transform="translate(190.7,49.3)"><circle r="6"/><line x1="-3" y1="-3" x2="3" y2="3" stroke="#9bf3ff"/></g>
  </g>

  <!-- núcleo (cérebro / reator) -->
  <circle cx="120" cy="120" r="66" fill="#04141f" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

  <!-- dobras / circuitos do cérebro -->
  <g fill="none" stroke="#39d8ff" stroke-width="1.4" opacity=".85" filter="url(#glow)">
    <path d="M120,66 q-9,20 0,38 q9,18 0,38 q-9,18 0,36"/>
    <path d="M82,98 q20,-9 40,0"/>
    <path d="M76,118 q22,-7 46,0"/>
    <path d="M82,138 q20,8 40,0"/>
    <path d="M92,156 q16,5 30,0"/>
  </g>

  <!-- traços de circuito saindo do núcleo -->
  <g stroke="#00e5ff" stroke-width="1.3" fill="none" opacity=".7" filter="url(#glow)">
    <path d="M120,54 V34"/><path d="M120,186 V206"/>
    <path d="M62,92 L40,80"/><path d="M178,92 L200,80"/>
    <path d="M62,150 L40,162"/><path d="M178,150 L200,162"/>
    <rect x="36" y="76" width="8" height="8" fill="#00e5ff" stroke="none"/>
    <rect x="196" y="76" width="8" height="8" fill="#00e5ff" stroke="none"/>
    <rect x="36" y="158" width="8" height="8" fill="#00e5ff" stroke="none"/>
    <rect x="196" y="158" width="8" height="8" fill="#00e5ff" stroke="none"/>
  </g>

  <!-- RACHA (falha) vermelho neon -->
  <polyline points="88,86 102,104 94,120 112,138 102,156 122,170" fill="none" stroke="#ff3a58" stroke-width="2.6" filter="url(#glow)"/>

  <!-- FAIXAS (spark) elétrica -->
  <polyline points="102,104 109,97 104,92 113,85" fill="none" stroke="#ffe14d" stroke-width="2.2" filter="url(#glow)"/>
  <polyline points="112,138 119,131 114,126 123,119" fill="none" stroke="#ffe14d" stroke-width="1.8" opacity=".9" filter="url(#glow)"/>

  <!-- parafuso VOANDO (com rastro) -->
  <path d="M168,52 q14,-12 30,-10" fill="none" stroke="#9bf3ff" stroke-width="1.2" opacity=".8"/>
  <g transform="translate(200,38)" filter="url(#glow)">
    <circle r="6" fill="#08283b" stroke="#00e5ff" stroke-width="1.6"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#9bf3ff"/>
  </g>

  <!-- peças metálicas voando -->
  <g fill="#08283b" stroke="#00e5ff" stroke-width="1.2">
    <rect x="58" y="56" width="9" height="9" transform="rotate(18 62 60)"/>
    <circle cx="178" cy="178" r="3.6"/>
    <circle cx="64" cy="180" r="3"/>
  </g>

  <!-- efeito glitch (deslocamento vermelho) -->
  <circle cx="125" cy="120" r="66" fill="none" stroke="#ff3a58" stroke-width="1.6" opacity=".22" filter="url(#glow)"/>
</svg>
