name: Build JARVIS Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Inject Spotify keys
        shell: bash
        run: |
          if [ -n "${{ secrets.SPOTIFY_CLIENT_ID }}" ]; then
            sed -i "s/__SPOTIFY_CLIENT_ID__/${{ secrets.SPOTIFY_CLIENT_ID }}/" windows/spotify_auth.py
            sed -i "s/__SPOTIFY_CLIENT_SECRET__/${{ secrets.SPOTIFY_CLIENT_SECRET }}/" windows/spotify_auth.py
          fi

      - name: Build EXE
        working-directory: windows
        run: |
          pyinstaller --noconsole --onefile --name JARVIS `
            --hidden-import=pyttsx3 `
            --hidden-import=speech_recognition `
            --hidden-import=pyaudio `
            --hidden-import=pycaw `
            --hidden-import=comtypes `
            --hidden-import=pystray `
            --hidden-import=spotify_auth `
            --hidden-import=commands `
            --hidden-import=voice `
            --hidden-import=obsidian_bridge `
            --collect-all pyaudio `
            --collect-all pycaw `
            nexus_app.py

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-pc-${{ github.run_number }}
          name: "JARVIS Windows v2 #${{ github.run_number }}"
          body: |
            ## JARVIS para Windows

            ✅ App de bandeja — fica minimizado e responde com a wake word "Jarvis"
            ✅ Voz masculina SAPI (PT-BR) + integração com TTS do servidor
            ✅ Conecta ao backend NEXUS na nuvem automaticamente
            ✅ Comandos locais: abrir programas, capturar tela, clima, volume
            ✅ Chat por voz e texto em streaming

            **Como usar:** Baixe o JARVIS.exe, execute (pode pedir permissão do Windows),
            configure o servidor se necessário (padrão: backend na nuvem).
          files: windows/dist/JARVIS.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
